# Copied from <skills>/manim-video/template on __DATE__.
# A separate environment, so the project's own environment does not carry manim, Cairo,
# Pango, ffmpeg, and Qt. Tested on linux-64; other platforms are listed but untested.
[workspace]
authors = []
channels = ["conda-forge"]
name = "__PROJECT__-manim"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[tasks]
render = "bash render.sh"

[dependencies]
manim = ">=0.22.0,<0.23"
numpy = ">=2.5.4,<3"
ffmpeg = ">=9.0.2,<10"
pillow = ">=12.3.0,<13"
# Reads exported tables (parquet, CSV) for a research video's plots.
polars = ">=2.0.0,<3"

[pypi-dependencies]
manim-slides = { version = ">=5.7.0, <6", extras = ["pyqt6"] }
